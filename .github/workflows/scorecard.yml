name: Scorecard

# Scores this repo's own security hygiene (branch protection, pinned
# Actions, code scanning enabled, etc.) — not a dependency/CVE scanner.
#
# NOTE: same caveat as codeql.yml — SARIF upload to the Security tab needs
# GitHub Advanced Security while this repo is private, and Scorecard only
# publishes results to the public API (scorecard.dev) for public repos. The
# job still runs and prints a score in the logs either way.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 3" # weekly

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false # flip to true once the repo is public

      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
